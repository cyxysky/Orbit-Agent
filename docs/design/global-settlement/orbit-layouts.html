    if(state.page==='chat'&&actions){if(state.variant==='a')actions.insertAdjacentHTML('afterbegin','<button class="btn btn-ghost" data-inspector-toggle aria-expanded="true">收起工作区</button>');if(state.variant==='b')actions.insertAdjacentHTML('afterbegin','<button class="btn btn-ghost" data-dock-toggle aria-expanded="true">收起对话</button><button class="btn btn-ghost" data-dock-expand>放大对话</button>');}
    if(state.page==='chat'&&state.variant==='b')app.querySelector('.conversation-dock')?.insertAdjacentHTML('afterend','<button class="dock-summary" data-dock-toggle hidden><span>对话已收起 · 周报资料已整理完成</span><strong>继续对话</strong></button>');
    document.querySelectorAll('[data-variant]').forEach(b=>{b.classList.toggle('active',b.dataset.variant===state.variant);b.setAttribute('aria-pressed',b.dataset.variant===state.variant)});pagePicker.value=state.page;document.getElementById('theme-toggle').innerHTML=icon('sun');document.title=`${p?.title} · ${['侧栏分区','上下工作台','连续阅读'][['a','b','c'].indexOf(state.variant)]} · Orbit 设计预览`;syncURL();if(state.overlay)showOverlay(state.overlay,false);}
  function buildPickers(){const order=Object.keys(groups);pagePicker.innerHTML=order.map(g=>`<optgroup label="${groupNames[g]}">${groups[g].filter(id=>pages[id]).map(id=>`<option value="${id}">${pages[id].title}</option>`).join('')}</optgroup>`).join('');overlayPicker.innerHTML='<option value="">选择浮层</option>'+Object.entries(overlays).map(([id,o])=>`<option value="${id}">${esc(o.title)}</option>`).join('');}
  function focusables(root){return [...root.querySelectorAll('button:not([disabled]),a[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),summary,[tabindex="0"]')].filter(el=>el.getClientRects().length);}
  function closeOverlay(){overlayRoot.innerHTML='';state.overlay='';overlayPicker.value='';app.inert=false;document.body.style.overflow='';syncURL();if(previousFocus?.isConnected)previousFocus.focus();previousFocus=null;}
  function showOverlay(id,remember=true,trigger=null){const entry=overlays[id];if(!entry)return;
    if(id==='delete'&&trigger){const row=trigger.closest('[data-item-name],tr,.list-row,.file-row,[data-searchable]');const name=trigger.dataset.deleteName||row?.dataset.itemName||(row?.querySelector('strong,h3')||row?.querySelector('td:first-child'))?.textContent?.trim();selection={name:name||'所选项目',type:trigger.dataset.deleteType||'',impact:trigger.dataset.deleteImpact||'删除后无法撤销，请确认所选项目。'};}
if(remember)previousFocus=document.activeElement;document.getElementById('nav-layer').innerHTML='';state.overlay=id;overlayPicker.value=id;let kind=entry.kind||'dialog';if(state.variant==='c'&&['account','skill','memory','integration','automation-task','schedule'].includes(id))kind='drawer';const footer=entry.footer?entry.footer(ctx()):'';overlayRoot.innerHTML=`<div class="overlay-backdrop kind-${kind} layout-${state.variant}" data-backdrop><section role="dialog" aria-modal="true" aria-labelledby="overlay-title" class="overlay-surface size-${entry.size||'md'}" tabindex="-1"><header class="overlay-head"><h2 id="overlay-title">${entry.title}</h2><button class="icon-btn" data-close aria-label="关闭${esc(entry.title)}">${icon('close')}</button></header><div class="overlay-body">${entry.render(ctx())}</div>${footer?`<footer class="overlay-footer">${footer}</footer>`:''}</section></div>`;app.inert=true;document.body.style.overflow='hidden';overlayRoot.querySelector('.overlay-surface').focus();syncURL();}
  function showNav(){closeOverlay();const n=document.getElementById('nav-layer');n.innerHTML=`<div class="nav-scrim" data-nav-backdrop><aside class="nav-drawer" role="dialog" aria-modal="true" aria-label="所有页面"><div class="split">${brand()}<button class="icon-btn" data-nav-close aria-label="关闭导航">${icon('close')}</button></div>${globals()}${Object.keys(groups).filter(g=>g!=='chat').map(g=>`<div><div class="section-label">${groupNames[g]}</div><nav class="section-nav">${groups[g].map(id=>navButton(id,null,null,state.page===id)).join('')}</nav></div>`).join('')}</aside></div>`;app.inert=true;n.querySelector('button').focus();}
  function closeNav(){document.getElementById('nav-layer').innerHTML='';app.inert=false;}
  function showIndex(){previousFocus=document.activeElement;overlayRoot.innerHTML=`<div class="overlay-backdrop layout-${state.variant}" data-backdrop><section class="overlay-surface size-xl" role="dialog" aria-modal="true" aria-labelledby="overlay-title" tabindex="-1"><header class="overlay-head"><div><h2 id="overlay-title">全部界面</h2><p class="muted small">${Object.keys(pages).length} 个页面 · ${Object.keys(overlays).length} 类弹窗与浮层 · 每一项均可在三套布局中查看</p></div><button class="icon-btn" data-close aria-label="关闭总览">${icon('close')}</button></header><div class="overlay-body"><div class="index-grid">${Object.keys(groups).map(g=>`<section class="index-group"><h3>${groupNames[g]}</h3>${groups[g].filter(id=>pages[id]).map(id=>`<button data-page="${id}">${pages[id].title}</button>`).join('')}</section>`).join('')}<section class="index-group"><h3>弹窗与浮层</h3>${Object.entries(overlays).map(([id,o])=>`<button data-overlay="${id}">${o.title}</button>`).join('')}</section></div></div></section></div>`;app.inert=true;overlayRoot.querySelector('.overlay-surface').focus();}
  function notify(label){const t=document.getElementById('preview-toast');t.textContent=`设计预览：${label}。不会提交到业务系统。`;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,3500);}
  document.addEventListener('click',event=>{const target=event.target.closest('button,[data-page],[data-overlay],[data-close],[data-open-index]');if(target?.hasAttribute('data-inspector-toggle')){const wrap=target.closest('.ws-workspace');const hidden=wrap.classList.toggle('inspector-hidden');target.textContent=hidden?'展开工作区':'收起工作区';target.setAttribute('aria-expanded',String(!hidden));return;}
    if(target?.hasAttribute('data-dock-toggle')){const wrap=target.closest('.ws-workspace');const collapsed=wrap.classList.toggle('dock-collapsed');wrap.querySelector('.dock-summary').hidden=!collapsed;const top=wrap.querySelector('.ws-heading [data-dock-toggle]');top.textContent=collapsed?'展开对话':'收起对话';top.setAttribute('aria-expanded',String(!collapsed));return;}
    if(target?.hasAttribute('data-dock-expand')){const wrap=target.closest('.ws-workspace');const expanded=wrap.classList.toggle('dock-expanded');target.textContent=expanded?'还原对话':'放大对话';return;}
    if(target?.dataset.variant){state.variant=target.dataset.variant;render();return;}if(target?.dataset.page){state.page=target.dataset.page;closeOverlay();closeNav();render();window.scrollTo({top:0});return;}if(target?.dataset.overlay){showOverlay(target.dataset.overlay,true,target);return;}if(target?.hasAttribute('data-close')){closeOverlay();return;}if(target?.hasAttribute('data-open-index')){showIndex();return;}if(target?.hasAttribute('data-nav')){showNav();return;}if(target?.hasAttribute('data-nav-close')){closeNav();return;}if(target?.id==='theme-toggle'){state.dark=!state.dark;render();return;}if(target?.classList.contains('switch')){const on=target.getAttribute('aria-checked')!=='true';target.setAttribute('aria-checked',String(on));target.classList.toggle('on',on);return;}if(target?.dataset.localTab){const group=target.closest('[data-tab-group]')||target.closest('.panel')||target.parentElement.parentElement;group.querySelectorAll('[data-local-tab]').forEach(b=>{if((b.closest('[data-tab-group]')||group)!==group)return;b.classList.toggle('active',b===target);b.setAttribute('aria-selected',b===target)});group.querySelectorAll('[data-local-panel]').forEach(p=>{if((p.closest('[data-tab-group]')||group)===group)p.hidden=p.dataset.localPanel!==target.dataset.localTab});return;}if(target?.dataset.demo){const form=target.closest('form');if(form&&!form.reportValidity())return;const label=target.dataset.demo;if(target.closest(".overlay-footer"))closeOverlay();notify(label);return;}if(event.target.hasAttribute('data-backdrop'))closeOverlay();if(event.target.hasAttribute('data-nav-backdrop'))closeNav();});
  document.addEventListener('submit',event=>{event.preventDefault();if(event.target.reportValidity())notify('已检查表单填写状态');});
  document.addEventListener('input',event=>{const input=event.target;if(input.hasAttribute('data-filter')){const scope=input.closest('.overlay-body')||document.querySelector('.page-content');let nodes=[];try{nodes=scope.querySelectorAll(input.dataset.filter||'[data-searchable]')}catch{}const q=input.value.trim().toLowerCase();nodes.forEach(node=>node.hidden=q&&!node.textContent.toLowerCase().includes(q));}});
  document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(overlayRoot.firstChild)closeOverlay();else closeNav();}if(event.key==='Tab'){const dialog=overlayRoot.querySelector('[role=dialog]')||document.querySelector('.nav-drawer');if(!dialog)return;const items=focusables(dialog);if(!items.length){event.preventDefault();return;}const first=items[0],last=items[items.length-1];if(event.shiftKey&&(document.activeElement===first||document.activeElement===dialog)){last.focus();event.preventDefault();}else if(!event.shiftKey&&(document.activeElement===last||!dialog.contains(document.activeElement))){first.focus();event.preventDefault();}}});
  pagePicker.addEventListener('change',()=>{state.page=pagePicker.value;closeOverlay();closeNav();render();window.scrollTo({top:0});});
  overlayPicker.addEventListener('change',()=>overlayPicker.value?showOverlay(overlayPicker.value):closeOverlay());
  buildPickers();render();
  window.OrbitPreview={getState:()=>({...state}),pages:pageOrder.filter(id=>pages[id]),overlays:Object.keys(overlays),navigate(id){state.page=id;closeOverlay();render()},open:showOverlay,close:closeOverlay};
})();
</script>
</body></html>
