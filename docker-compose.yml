services:
  webpilot-qa:
    build:
      context: .
      args:
        ORBIT_BASE_PATH: ${ORBIT_BASE_PATH-${WEBPILOT_BASE_PATH:-}}
    image: orbit:latest
    depends_on:
      webpilot-code-sandbox:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      APP_DATA_DIR: /app
      ARTIFACTS_DIR: /app/artifacts
      BROWSER_CHAT_PREVIEW_WS_PORT: "${BROWSER_CHAT_PREVIEW_WS_PORT:-18021}"
      ORBIT_DEFAULT_USER_ID: "${ORBIT_DEFAULT_USER_ID-${WEBPILOT_DEFAULT_USER_ID:-1}}"
      ORBIT_REQUIRE_MOUNT_USER_ID: "${ORBIT_REQUIRE_MOUNT_USER_ID-${WEBPILOT_REQUIRE_MOUNT_USER_ID:-true}}"
      ORBIT_CODE_SANDBOX_SERVICE_URL: "http://webpilot-code-sandbox:18100"
      CODE_SANDBOX_RUNNER_TOKEN: "${CODE_SANDBOX_RUNNER_TOKEN:?CODE_SANDBOX_RUNNER_TOKEN must be set}"
    volumes:
      - ./.data:/app/.data
      - ./artifacts:/app/artifacts
    restart: unless-stopped

  webpilot-code-sandbox:
    image: orbit:latest
    command: ["node", "server/code-sandbox-runner.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18100/health',{headers:{authorization:'Bearer '+process.env.CODE_SANDBOX_RUNNER_TOKEN},signal:AbortSignal.timeout(2000)}).then(async r=>{if(!r.ok||(await r.json()).status!=='healthy')process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    environment:
      CODE_SANDBOX_RUNNER_HOST: 0.0.0.0
      CODE_SANDBOX_RUNNER_PORT: "18100"
      CODE_SANDBOX_RUNNER_WORKSPACE: /tmp/webpilot-code-sandbox
      CODE_SANDBOX_RUNNER_TOKEN: "${CODE_SANDBOX_RUNNER_TOKEN:?CODE_SANDBOX_RUNNER_TOKEN must be set}"
      CODE_SANDBOX_RUNNER_CONCURRENCY: "${CODE_SANDBOX_RUNNER_CONCURRENCY:-2}"
    read_only: true
    tmpfs:
      - /tmp:size=768m,mode=1777
    mem_limit: ${CODE_SANDBOX_RUNNER_MEMORY_LIMIT:-768m}
    cpus: ${CODE_SANDBOX_RUNNER_CPU_LIMIT:-2.0}
    pids_limit: ${CODE_SANDBOX_RUNNER_PIDS_LIMIT:-128}
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - KILL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
