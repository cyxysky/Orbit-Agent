apiVersion: v1
kind: Namespace
metadata:
  name: orbit
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: orbit-config
data:
  NODE_ENV: production
  HOSTNAME: "0.0.0.0"
  PORT: "3000"
  # Must match the Docker build argument. Empty means the domain root.
  ORBIT_BASE_PATH: ""
  ORBIT_TRUST_PROXY: "true"
  ORBIT_DEBUG_ROUTES_ENABLED: "false"
  ORBIT_SELF_BOOTSTRAP_ENABLED: "false"
  ORBIT_HOST_EXECUTION_ENABLED: "false"
  ORBIT_DEFAULT_USER_ID: "1"
  ORBIT_USER_COOKIE_CHECK_ENABLED: "false"
  ORBIT_CROSS_SITE_MOUNT: "false"
  ORBIT_ADMIN_SETTINGS_PASSWORD_ENABLED: "true"
  ORBIT_API_HEAP_MB: "512"
  ORBIT_EXECUTION_HEAP_MB: "1536"
  ORBIT_CODE_SANDBOX_SERVICE_URL: http://127.0.0.1:18100
  APP_DATA_DIR: /var/lib/orbit
  ARTIFACTS_DIR: /var/lib/orbit/artifacts
  DATABASE_DRIVER: sqlite
  SQLITE_DATABASE_PATH: /var/lib/orbit/.data/webpilot.db
  CAPABILITY_TOOLS_HOME: /var/lib/orbit/tool-components
  # Replace with your internal npm mirror before installing tools offline.
  CAPABILITY_TOOL_REGISTRY: https://registry.npmjs.org
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: orbit-data
spec:
  accessModes: [ReadWriteOnce]
  # Uses the cluster's default StorageClass. Set storageClassName if required.
  resources:
    requests:
      storage: 30Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: orbit-tools
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 30Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit
spec:
  # SQLite, scheduling and live tool sessions currently require one app instance.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: orbit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orbit
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # For a private registry, create this Secret and uncomment these lines.
      # imagePullSecrets:
      #   - name: orbit-registry
      containers:
        - name: orbit
          image: orbit-app
          imagePullPolicy: IfNotPresent
          ports:
            - name: app-http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: orbit-config
            - secretRef:
                name: orbit-secrets
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /var/lib/orbit
            - name: tools
              mountPath: /var/lib/orbit/tool-components
            - name: browser-shm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
              ephemeral-storage: 4Gi
          # HTTP routes require a mounted identity. TCP probes don't impersonate users.
          startupProbe:
            tcpSocket:
              port: app-http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: app-http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: app-http
            periodSeconds: 15
            failureThreshold: 6
        - name: code-sandbox
          # Same application image; no extra Orbit runner image is needed.
          image: orbit-app
          imagePullPolicy: IfNotPresent
          command: [node, server/code-sandbox-runner.js]
          env:
            - name: CODE_SANDBOX_RUNNER_HOST
              value: "127.0.0.1"
            - name: CODE_SANDBOX_RUNNER_PORT
              value: "18100"
            - name: CODE_SANDBOX_RUNNER_WORKSPACE
              value: /tmp/orbit-code-sandbox
            - name: CODE_SANDBOX_RUNNER_CONCURRENCY
              value: "2"
            - name: CAPABILITY_TOOLS_HOME
              value: /var/lib/orbit/tool-components
            - name: CODE_SANDBOX_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: orbit-secrets
                  key: CODE_SANDBOX_RUNNER_TOKEN
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              # The supervisor drops privileges before executing untrusted jobs.
              add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID, KILL]
          volumeMounts:
            - name: tools
              mountPath: /var/lib/orbit/tool-components
              readOnly: true
            - name: sandbox-work
              mountPath: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 3Gi
          startupProbe:
            exec: &sandbox-health
              command:
                - node
                - -e
                - >-
                  fetch('http://127.0.0.1:18100/health',{headers:{authorization:'Bearer '+process.env.CODE_SANDBOX_RUNNER_TOKEN},signal:AbortSignal.timeout(2000)}).then(async r=>{const v=await r.json();if(!r.ok||v.status!=='healthy'||v.isolation!=='linux-landlock-v1')process.exit(1)}).catch(()=>process.exit(1))
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: *sandbox-health
            timeoutSeconds: 5
            periodSeconds: 15
          livenessProbe:
            exec: *sandbox-health
            timeoutSeconds: 5
            periodSeconds: 30
            failureThreshold: 3
        - name: nginx
          image: nginx:stable-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: orbit-data
        - name: tools
          persistentVolumeClaim:
            claimName: orbit-tools
        - name: browser-shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: sandbox-work
          emptyDir:
            sizeLimit: 2Gi
        - name: nginx-config
          configMap:
            name: orbit-nginx
        - name: nginx-cache
          emptyDir:
            sizeLimit: 128Mi
        - name: nginx-run
          emptyDir: {}
        - name: nginx-tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: orbit
spec:
  type: NodePort
  # Preserve the TLS gateway address for the trusted-proxy rules in Nginx.
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: orbit
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
