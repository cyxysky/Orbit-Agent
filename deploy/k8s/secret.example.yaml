# Copy outside Git, replace all values, then apply before deploying the workload.
apiVersion: v1
kind: Secret
metadata:
  name: orbit-secrets
  namespace: orbit
type: Opaque
stringData:
  ORBIT_ADMIN_SETTINGS_PASSWORD: REPLACE_WITH_A_RANDOM_ADMIN_PASSWORD
  CODE_SANDBOX_RUNNER_TOKEN: REPLACE_WITH_A_RANDOM_RUNNER_TOKEN
  # Exactly 32 random bytes, encoded as base64 or 64 hex characters. Keep stable.
  WEBPILOT_CREDENTIAL_MASTER_KEY: REPLACE_WITH_A_RANDOM_32_BYTE_KEY
  # For PostgreSQL, add DATABASE_URL here and set DATABASE_DRIVER in orbit-config.
