# Loaded inside the Nginx http {} context as /etc/nginx/conf.d/default.conf.
map $http_upgrade $orbit_connection_upgrade {
    default upgrade;
    ''      close;
}

# Add only your TLS gateway's real source IP/CIDR here. Keep untrusted clients out.
geo $orbit_trusted_proxy {
    default 0;
    127.0.0.1/32 1;
    # 10.10.0.90/32 1;
}
map "$orbit_trusted_proxy:$http_x_forwarded_proto" $orbit_forwarded_proto {
    default $scheme;
    "1:https" https;
    "1:http" http;
}
map $orbit_forwarded_proto $orbit_default_port {
    default 80;
    https 443;
}
map $http_host $orbit_host_port {
    default $orbit_default_port;
    ~:(?<orbit_explicit_port>[0-9]+)$ $orbit_explicit_port;
}
map "$orbit_trusted_proxy:$http_x_forwarded_port" $orbit_forwarded_port {
    default $orbit_host_port;
    ~^1:(?<orbit_gateway_port>[0-9]+)$ $orbit_gateway_port;
}

upstream orbit_backend {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 100m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    location / {
        # Preserve the complete URI, including a build-time basePath if present.
        proxy_pass http://orbit_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $orbit_forwarded_proto;
        proxy_set_header X-Forwarded-Port $orbit_forwarded_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $orbit_connection_upgrade;

        # Deliver SSE and streamed model output as soon as it arrives.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
